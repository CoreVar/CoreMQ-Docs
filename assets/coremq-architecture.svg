<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc"><title id="title">CoreMQ connection and management paths</title><desc id="desc">CoreDM + MQTT clients connect to CoreMQ listeners. Database and Redis support state and cloud coordination. Bridges forward selected messages to other systems. CLI and browser use HTTP management. CoreDM opens MQTT connections to CoreMQ. CoreVar Portal manages CoreMQ through CoreControl. The opt-in CoreMQ connector opens outbound HTTPS to CoreControl, not directly to Portal.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2e6265"/></marker></defs><rect width="1080" height="540" rx="16" fill="#f5fafa"/><g font-family="Arial,sans-serif" fill="#163839"><text x="34" y="42" font-size="27" font-weight="bold">CoreMQ • separate traffic, state and management paths</text><g fill="white" stroke="#39787a" stroke-width="2"><rect x="40" y="100" width="220" height="100" rx="10"/><rect x="40" y="330" width="220" height="100" rx="10"/><rect x="400" y="170" width="240" height="150" rx="12" fill="#d9eded"/><rect x="800" y="95" width="240" height="105" rx="10"/><rect x="800" y="235" width="240" height="105" rx="10"/><rect x="800" y="380" width="240" height="105" rx="10"/></g><g text-anchor="middle" font-size="21"><text x="150" y="140" font-weight="bold">CoreDM + MQTT clients</text><text x="150" y="170">TLS / identity / topics</text><text x="150" y="370" font-weight="bold">Browser + CLI</text><text x="150" y="400">Management origin</text><text x="520" y="220" font-size="32" font-weight="bold">CoreMQ</text><text x="520" y="257">Listeners + authorization</text><text x="520" y="290">Broker + opt-in connector</text><text x="920" y="133" font-weight="bold">Database + Redis</text><text x="920" y="166">State + cloud backplane</text><text x="920" y="275" font-weight="bold">Bridge destinations</text><text x="920" y="308">MQTT / Kafka listeners</text><text x="920" y="420" font-weight="bold">CoreControl</text><text x="920" y="453">Authorized commands</text></g><g fill="none" stroke="#2e6265" stroke-width="3" marker-end="url(#arrow)"><path d="M260 150H320V205H400"/><path d="M260 380H320V285H400"/><path d="M640 205H710V150H800"/><path d="M640 270H800"/><path d="M640 305H710V433H800"/></g><g font-size="18"><text x="277" y="124">MQTT</text><text x="273" y="409">HTTP(S)</text><text x="670" y="126">Dependencies</text><text x="661" y="257">Selected messages</text><text x="634" y="478">Outbound HTTPS • no inbound control listener</text></g><text x="40" y="515" font-size="17">Bridges are distinct from Redis coordination and CoreControl. CoreVar Portal → CoreControl → CoreMQ management.</text></g></svg>